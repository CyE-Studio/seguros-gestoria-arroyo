name: Publicar en Cloudflare Workers

# Web de producción. Se activa cuando la variable de repositorio
# CLOUDFLARE_ENABLED vale "true" (así no falla antes de configurar la cuenta).
# También se puede lanzar a mano desde la pestaña Actions.
#
# Secretos del repositorio:  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variables del repositorio: CLOUDFLARE_ENABLED, NEXT_PUBLIC_SITE_URL,
#                            NEXT_PUBLIC_SANITY_PROJECT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar y desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Las NEXT_PUBLIC_* se incrustan en el build.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
        run: npm run cf:deploy
